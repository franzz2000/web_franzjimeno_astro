name: Refresh security override lockfile

on:
  push:
    branches: [upgrade/astro-7]
    paths:
      - .github/workflows/astro-lock-security.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify security audit
        run: npm audit --audit-level=moderate
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: actualizar lockfile con selector parser corregido'
            git push origin HEAD:upgrade/astro-7
          fi
