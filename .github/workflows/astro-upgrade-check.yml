name: Validate Astro upgrade branch

on:
  push:
    branches:
      - upgrade/astro-7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: npm run build
